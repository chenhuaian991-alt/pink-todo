<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <!-- Cat-ear girl waving - detailed anime style -->
  <defs>
    <linearGradient id="hair1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb3d9"/>
      <stop offset="100%" stop-color="#ff69b4"/>
    </linearGradient>
    <linearGradient id="skin1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#ffe4e8"/>
    </linearGradient>
    <linearGradient id="dress1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcce0"/>
      <stop offset="100%" stop-color="#ff99c2"/>
    </linearGradient>
  </defs>
  <!-- Hair back -->
  <ellipse cx="100" cy="85" rx="55" ry="50" fill="url(#hair1)"/>
  <path d="M45 85 Q35 130, 50 170 Q40 180, 55 175 Q48 140, 55 100" fill="url(#hair1)"/>
  <path d="M155 85 Q165 130, 150 170 Q160 180, 145 175 Q152 140, 145 100" fill="url(#hair1)"/>
  <!-- Cat ears -->
  <path d="M58 52 L42 8 L80 42Z" fill="#ffb3d9" stroke="#ff69b4" stroke-width="1"/>
  <path d="M62 50 L48 16 L76 44Z" fill="#ff99c2" opacity="0.6"/>
  <path d="M142 52 L158 8 L120 42Z" fill="#ffb3d9" stroke="#ff69b4" stroke-width="1"/>
  <path d="M138 50 L152 16 L124 44Z" fill="#ff99c2" opacity="0.6"/>
  <!-- Face -->
  <ellipse cx="100" cy="82" rx="40" ry="38" fill="url(#skin1)"/>
  <!-- Hair front / bangs -->
  <path d="M60 55 Q75 35, 90 55 Q95 40, 105 55 Q115 35, 140 55 Q130 45, 120 50 Q110 38, 100 50 Q90 38, 80 50 Q70 45, 60 55Z" fill="url(#hair1)"/>
  <path d="M55 60 Q50 80, 52 100" stroke="#ff69b4" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M145 60 Q150 80, 148 100" stroke="#ff69b4" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Eyes - big anime style -->
  <ellipse cx="82" cy="82" rx="10" ry="12" fill="#4a3728"/>
  <ellipse cx="118" cy="82" rx="10" ry="12" fill="#4a3728"/>
  <ellipse cx="80" cy="78" rx="4" ry="5" fill="white"/>
  <ellipse cx="116" cy="78" rx="4" ry="5" fill="white"/>
  <ellipse cx="85" cy="84" rx="2" ry="2" fill="white" opacity="0.6"/>
  <ellipse cx="121" cy="84" rx="2" ry="2" fill="white" opacity="0.6"/>
  <!-- Eyelashes -->
  <path d="M72 74 Q78 70, 82 72" stroke="#4a3728" stroke-width="1.5" fill="none"/>
  <path d="M128 74 Q122 70, 118 72" stroke="#4a3728" stroke-width="1.5" fill="none"/>
  <!-- Blush -->
  <ellipse cx="68" cy="95" rx="10" ry="5" fill="#ffb8d0" opacity="0.6"/>
  <ellipse cx="132" cy="95" rx="10" ry="5" fill="#ffb8d0" opacity="0.6"/>
  <!-- Mouth - cute smile -->
  <path d="M92 100 Q100 108, 108 100" stroke="#e07070" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M96 100 Q100 104, 104 100" fill="#e07070" opacity="0.3"/>
  <!-- Bow on head -->
  <path d="M120 40 Q108 28, 102 40 Q108 36, 120 40Z" fill="#ff4081"/>
  <path d="M120 40 Q132 28, 138 40 Q132 36, 120 40Z" fill="#ff4081"/>
  <circle cx="120" cy="40" r="4" fill="#e03060"/>
  <!-- Body / dress -->
  <path d="M72 118 Q65 130, 60 165 L140 165 Q135 130, 128 118Z" fill="url(#dress1)"/>
  <path d="M78 118 Q74 135, 70 165 L130 165 Q126 135, 122 118Z" fill="#fff0f5" opacity="0.5"/>
  <!-- Collar / ribbon -->
  <path d="M88 118 L100 132 L112 118" fill="none" stroke="#ff69b4" stroke-width="2"/>
  <circle cx="100" cy="118" r="5" fill="#ff4081"/>
  <!-- Dress frills -->
  <path d="M60 165 Q70 175, 80 168 Q90 178, 100 170 Q110 178, 120 168 Q130 175, 140 165" fill="#ffb3d9" opacity="0.6"/>
  <!-- Waving arm -->
  <path d="M60 130 Q40 115, 28 85" stroke="#fff5f5" stroke-width="10" stroke-linecap="round" fill="none"/>
  <ellipse cx="25" cy="80" rx="10" ry="9" fill="#fff5f5" stroke="#ffccd5" stroke-width="1"/>
  <!-- Fingers -->
  <path d="M18 74 Q14 66, 20 62" stroke="#ffccd5" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M22 72 Q19 64, 25 60" stroke="#ffccd5" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M27 73 Q26 65, 32 62" stroke="#ffccd5" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M32 76 Q33 68, 38 66" stroke="#ffccd5" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Other arm -->
  <path d="M140 130 Q150 145, 148 160" stroke="#fff5f5" stroke-width="9" stroke-linecap="round" fill="none"/>
  <ellipse cx="148" cy="164" rx="9" ry="8" fill="#fff5f5" stroke="#ffccd5" stroke-width="1"/>
  <!-- Sparkles -->
  <text x="8" y="58" font-size="18" opacity="0.8">✨</text>
  <text x="165" y="180" font-size="14" opacity="0.7">⭐</text>
  <text x="4" y="170" font-size="12" opacity="0.5">💫</text>
</svg>
