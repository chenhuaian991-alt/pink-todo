<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <!-- Magical girl with star wand -->
  <defs>
    <linearGradient id="hair2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#ffe8ee"/>
    </linearGradient>
    <linearGradient id="dress2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- Witch hat -->
  <path d="M72 50 L100 2 L128 50Z" fill="#d8b4fe" stroke="#a855f7" stroke-width="1"/>
  <path d="M76 48 L100 8 L124 48Z" fill="#c084fc" opacity="0.5"/>
  <ellipse cx="100" cy="50" rx="40" ry="10" fill="#d8b4fe"/>
  <rect x="62" y="46" width="76" height="6" rx="3" fill="#a855f7"/>
  <text x="92" y="38" font-size="16">⭐</text>
  <!-- Hair -->
  <ellipse cx="100" cy="72" rx="45" ry="38" fill="url(#hair2)"/>
  <!-- Twin tails -->
  <path d="M55 68 Q30 90, 38 130 Q28 140, 42 135 Q50 110, 52 80" fill="url(#hair2)"/>
  <path d="M145 68 Q170 90, 162 130 Q172 140, 158 135 Q150 110, 148 80" fill="url(#hair2)"/>
  <!-- Face -->
  <ellipse cx="100" cy="78" rx="36" ry="34" fill="url(#skin2)"/>
  <!-- Bangs -->
  <path d="M64 60 Q80 42, 92 60 Q96 46, 104 60 Q112 42, 136 60 Q125 50, 116 56 Q108 44, 100 56 Q92 44, 84 56 Q75 50, 64 60Z" fill="url(#hair2)"/>
  <!-- Eyes - sparkly -->
  <ellipse cx="84" cy="78" rx="10" ry="13" fill="#5b3a8a"/>
  <ellipse cx="116" cy="78" rx="10" ry="13" fill="#5b3a8a"/>
  <ellipse cx="82" cy="73" rx="5" ry="6" fill="white"/>
  <ellipse cx="114" cy="73" rx="5" ry="6" fill="white"/>
  <ellipse cx="87" cy="80" rx="2.5" ry="2.5" fill="white" opacity="0.7"/>
  <ellipse cx="119" cy="80" rx="2.5" ry="2.5" fill="white" opacity="0.7"/>
  <!-- Star in eyes -->
  <path d="M84 78 l1.5-3 1.5 3 3 1-2.2 2 .5 3.2-2.8-1.5-2.8 1.5.5-3.2-2.2-2z" fill="white" opacity="0.4" transform="scale(0.5) translate(126,120)"/>
  <!-- Eyelashes -->
  <path d="M74 69 Q80 65, 84 67" stroke="#5b3a8a" stroke-width="1.5" fill="none"/>
  <path d="M126 69 Q120 65, 116 67" stroke="#5b3a8a" stroke-width="1.5" fill="none"/>
  <!-- Blush -->
  <ellipse cx="70" cy="90" rx="9" ry="5" fill="#ffb8d0" opacity="0.55"/>
  <ellipse cx="130" cy="90" rx="9" ry="5" fill="#ffb8d0" opacity="0.55"/>
  <!-- Mouth -->
  <path d="M94 96 Q100 102, 106 96" stroke="#d07070" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Body -->
  <path d="M74 112 Q68 125, 64 158 L136 158 Q132 125, 126 112Z" fill="url(#dress2)"/>
  <path d="M80 112 Q76 128, 72 158 L128 158 Q124 128, 120 112Z" fill="#f5f0ff" opacity="0.4"/>
  <!-- Star brooch -->
  <polygon points="100,112 103,118 110,119 105,123 106,130 100,126 94,130 95,123 90,119 97,118" fill="#ffd700" stroke="#f0c000" stroke-width="0.5"/>
  <!-- Dress frills -->
  <path d="M64 158 Q75 170, 85 162 Q95 172, 100 164 Q105 172, 115 162 Q125 170, 136 158" fill="#d8b4fe" opacity="0.5"/>
  <!-- Wand arm -->
  <path d="M136 125 Q155 108, 168 72" stroke="#fff5f5" stroke-width="9" stroke-linecap="round" fill="none"/>
  <ellipse cx="170" cy="68" rx="9" ry="8" fill="#fff5f5" stroke="#e0d0f0" stroke-width="1"/>
  <!-- Wand -->
  <line x1="170" y1="60" x2="180" y2="20" stroke="#d4a05a" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="180,10 185,20 180,30 175,20" fill="#ffd700" opacity="0.9"/>
  <polygon points="180,14 183,20 180,26 177,20" fill="#fff8dc"/>
  <!-- Other arm -->
  <path d="M64 125 Q55 140, 58 155" stroke="#fff5f5" stroke-width="8" stroke-linecap="round" fill="none"/>
  <ellipse cx="58" cy="158" rx="8" ry="7" fill="#fff5f5" stroke="#e0d0f0" stroke-width="1"/>
  <!-- Sparkles -->
  <text x="182" y="8" font-size="14" opacity="0.8">✨</text>
  <text x="160" y="32" font-size="10" opacity="0.6">💫</text>
  <text x="30" y="50" font-size="12" opacity="0.5">🦇</text>
</svg>
