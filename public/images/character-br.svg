<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <!-- Girl reading a book -->
  <defs>
    <linearGradient id="hair4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="skin4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#ffe4e8"/>
    </linearGradient>
    <linearGradient id="dress4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd6e7"/>
      <stop offset="100%" stop-color="#ffa0c0"/>
    </linearGradient>
  </defs>
  <!-- Hair back -->
  <ellipse cx="100" cy="68" rx="48" ry="42" fill="url(#hair4)"/>
  <!-- Side ponytail -->
  <path d="M148 60 Q170 80, 165 120 Q175 130, 160 128 Q150 108, 146 75" fill="url(#hair4)"/>
  <path d="M160 120 Q172 135, 165 150" stroke="#f43f5e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Face -->
  <ellipse cx="100" cy="75" rx="38" ry="35" fill="url(#skin4)"/>
  <!-- Bangs -->
  <path d="M62 58 Q78 38, 90 58 Q96 42, 106 58 Q116 38, 138 58 Q128 48, 118 54 Q108 40, 100 54 Q92 40, 82 54 Q72 48, 62 58Z" fill="url(#hair4)"/>
  <!-- Hair strands framing face -->
  <path d="M62 62 Q56 85, 60 105" stroke="#f43f5e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Eyes - looking down at book (half closed) -->
  <path d="M80 76 Q86 82, 92 76" stroke="#4a3040" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M108 76 Q114 82, 120 76" stroke="#4a3040" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Eyelashes -->
  <path d="M78 72 Q82 69, 84 72" stroke="#4a3040" stroke-width="1.2" fill="none"/>
  <path d="M122 72 Q118 69, 116 72" stroke="#4a3040" stroke-width="1.2" fill="none"/>
  <!-- Blush -->
  <ellipse cx="70" cy="88" rx="9" ry="5" fill="#ffb8d0" opacity="0.6"/>
  <ellipse cx="130" cy="88" rx="9" ry="5" fill="#ffb8d0" opacity="0.6"/>
  <!-- Mouth - gentle smile -->
  <path d="M94 96 Q100 100, 106 96" stroke="#d07070" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Hair star accessory -->
  <text x="142" y="48" font-size="18">🌟</text>
  <!-- Body -->
  <path d="M74 108 Q68 120, 64 152 L136 152 Q132 120, 126 108Z" fill="url(#dress4)"/>
  <path d="M80 108 Q76 122, 72 152 L128 152 Q124 122, 120 108Z" fill="#fff0f5" opacity="0.4"/>
  <!-- Collar -->
  <circle cx="100" cy="108" r="4" fill="#ff69b4"/>
  <path d="M92 108 Q100 118, 108 108" fill="none" stroke="#ff69b4" stroke-width="1.5"/>
  <!-- Book -->
  <rect x="68" y="152" width="64" height="44" rx="4" fill="#fff8dc" stroke="#e8c860" stroke-width="2"/>
  <line x1="100" y1="152" x2="100" y2="196" stroke="#e8c860" stroke-width="2"/>
  <!-- Book lines left page -->
  <line x1="76" y1="162" x2="94" y2="162" stroke="#e8c860" stroke-width="1" opacity="0.5"/>
  <line x1="76" y1="168" x2="92" y2="168" stroke="#e8c860" stroke-width="1" opacity="0.5"/>
  <line x1="76" y1="174" x2="94" y2="174" stroke="#e8c860" stroke-width="1" opacity="0.5"/>
  <line x1="76" y1="180" x2="90" y2="180" stroke="#e8c860" stroke-width="1" opacity="0.5"/>
  <!-- Book lines right page -->
  <line x1="106" y1="162" x2="124" y2="162" stroke="#e8c860" stroke-width="1" opacity="0.5"/>
  <line x1="106" y1="168" x2="122" y2="168" stroke="#e8c860" stroke-width="1" opacity="0.5"/>
  <line x1="106" y1="174" x2="124" y2="174" stroke="#e8c860" stroke-width="1" opacity="0.5"/>
  <line x1="106" y1="180" x2="120" y2="180" stroke="#e8c860" stroke-width="1" opacity="0.5"/>
  <!-- Arms holding book -->
  <path d="M74 120 Q62 135, 66 155" stroke="#fff5f5" stroke-width="9" stroke-linecap="round" fill="none"/>
  <ellipse cx="66" cy="158" rx="9" ry="8" fill="#fff5f5" stroke="#ffccd5" stroke-width="1"/>
  <path d="M126 120 Q138 135, 134 155" stroke="#fff5f5" stroke-width="9" stroke-linecap="round" fill="none"/>
  <ellipse cx="134" cy="158" rx="9" ry="8" fill="#fff5f5" stroke="#ffccd5" stroke-width="1"/>
  <!-- Legs -->
  <path d="M82 196 L78 230" stroke="#ffd6e7" stroke-width="10" stroke-linecap="round"/>
  <path d="M118 196 L122 230" stroke="#ffd6e7" stroke-width="10" stroke-linecap="round"/>
  <!-- Shoes -->
  <ellipse cx="76" cy="235" rx="12" ry="6" fill="#ff99b8"/>
  <ellipse cx="124" cy="235" rx="12" ry="6" fill="#ff99b8"/>
  <!-- Sparkles -->
  <text x="18" y="80" font-size="14" opacity="0.7">✨</text>
  <text x="168" y="170" font-size="16" opacity="0.6">🎀</text>
  <text x="30" y="200" font-size="10" opacity="0.5">💫</text>
</svg>
