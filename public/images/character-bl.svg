<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" fill="none">
  <!-- Cute kawaii bear mascot -->
  <defs>
    <linearGradient id="bear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcce0"/>
      <stop offset="100%" stop-color="#ff99b8"/>
    </linearGradient>
  </defs>
  <!-- Ears -->
  <circle cx="58" cy="48" r="22" fill="url(#bear)" stroke="#ff80a0" stroke-width="1.5"/>
  <circle cx="58" cy="48" r="14" fill="#ffe0ec"/>
  <circle cx="142" cy="48" r="22" fill="url(#bear)" stroke="#ff80a0" stroke-width="1.5"/>
  <circle cx="142" cy="48" r="14" fill="#ffe0ec"/>
  <!-- Head -->
  <ellipse cx="100" cy="75" rx="52" ry="46" fill="url(#bear)"/>
  <!-- Face inner -->
  <ellipse cx="100" cy="80" rx="42" ry="36" fill="#fff0f5"/>
  <!-- Eyes - happy squinting -->
  <path d="M76 74 Q82 66, 88 74" stroke="#595959" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M112 74 Q118 66, 124 74" stroke="#595959" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Eyelashes -->
  <path d="M74 70 Q78 67, 80 70" stroke="#595959" stroke-width="1" fill="none"/>
  <path d="M126 70 Q122 67, 120 70" stroke="#595959" stroke-width="1" fill="none"/>
  <!-- Blush -->
  <ellipse cx="65" cy="88" rx="12" ry="6" fill="#ffb8d0" opacity="0.6"/>
  <ellipse cx="135" cy="88" rx="12" ry="6" fill="#ffb8d0" opacity="0.6"/>
  <!-- Nose -->
  <ellipse cx="100" cy="85" rx="6" ry="4.5" fill="#ff99b8"/>
  <ellipse cx="99" cy="84" rx="2" ry="1.5" fill="#ffcce0" opacity="0.6"/>
  <!-- Mouth -->
  <path d="M90 94 Q100 104, 110 94" stroke="#e08090" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M94 94 Q100 100, 106 94" fill="#e08090" opacity="0.2"/>
  <!-- Body -->
  <ellipse cx="100" cy="170" rx="44" ry="40" fill="url(#bear)"/>
  <ellipse cx="100" cy="174" rx="34" ry="30" fill="#fff0f5"/>
  <!-- Belly patch -->
  <ellipse cx="100" cy="178" rx="22" ry="20" fill="#ffe8f0" opacity="0.6"/>
  <!-- Bow -->
  <path d="M88 120 Q78 110, 72 120 Q78 116, 88 120Z" fill="#ff4081"/>
  <path d="M88 120 Q98 110, 104 120 Q98 116, 88 120Z" fill="#ff4081"/>
  <circle cx="88" cy="120" r="4" fill="#e03060"/>
  <!-- Arms -->
  <ellipse cx="52" cy="165" rx="14" ry="12" fill="url(#bear)" transform="rotate(-15 52 165)"/>
  <ellipse cx="148" cy="165" rx="14" ry="12" fill="url(#bear)" transform="rotate(15 148 165)"/>
  <!-- Paws -->
  <ellipse cx="42" cy="175" rx="10" ry="8" fill="#ffe0ec" stroke="#ff99b8" stroke-width="1"/>
  <ellipse cx="158" cy="175" rx="10" ry="8" fill="#ffe0ec" stroke="#ff99b8" stroke-width="1"/>
  <!-- Paw pads -->
  <circle cx="39" cy="173" r="2" fill="#ff99b8" opacity="0.5"/>
  <circle cx="45" cy="173" r="2" fill="#ff99b8" opacity="0.5"/>
  <circle cx="155" cy="173" r="2" fill="#ff99b8" opacity="0.5"/>
  <circle cx="161" cy="173" r="2" fill="#ff99b8" opacity="0.5"/>
  <!-- Feet -->
  <ellipse cx="80" cy="208" rx="16" ry="10" fill="url(#bear)"/>
  <ellipse cx="120" cy="208" rx="16" ry="10" fill="url(#bear)"/>
  <ellipse cx="80" cy="210" rx="10" ry="6" fill="#ffe0ec"/>
  <ellipse cx="120" cy="210" rx="10" ry="6" fill="#ffe0ec"/>
  <!-- Sparkles -->
  <text x="10" y="130" font-size="16" opacity="0.7">💕</text>
  <text x="170" y="220" font-size="12" opacity="0.6">💖</text>
  <text x="160" y="60" font-size="10" opacity="0.5">✨</text>
</svg>
