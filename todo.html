<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✧ 待办清单 ✧</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink-100: #fff0f5;
    --pink-200: #ffd6e7;
    --pink-300: #ffadd2;
    --pink-400: #ff85c0;
    --pink-500: #f759ab;
    --pink-600: #eb2f96;
    --pink-700: #c41d7f;
    --lavender: #efdbff;
    --white: #ffffff;
    --text: #595959;
    --text-light: #8c8c8c;
    --shadow: 0 8px 32px rgba(255, 133, 192, 0.18);
    --radius: 16px;
  }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--pink-100);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    overflow-x: hidden;
    position: relative;
  }

  /* ── 飘浮装饰 ── */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    opacity: 0.25;
    pointer-events: none;
    animation: float 8s ease-in-out infinite;
  }
  body::before {
    width: 300px; height: 300px;
    background: radial-gradient(circle, var(--pink-300), transparent 70%);
    top: -80px; left: -100px;
  }
  body::after {
    width: 400px; height: 400px;
    background: radial-gradient(circle, var(--lavender), transparent 70%);
    bottom: -120px; right: -150px;
    animation-delay: -4s;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-30px) scale(1.05); }
  }

  /* ── 樱花飘落 ── */
  .sakura {
    position: fixed;
    top: -20px;
    pointer-events: none;
    font-size: 16px;
    opacity: 0.6;
    animation: fall linear infinite;
    z-index: 0;
  }
  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 0.7; }
    100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
  }

  /* ── 主容器 ── */
  .app {
    width: 100%;
    max-width: 520px;
    position: relative;
    z-index: 1;
  }

  /* ── 头部卡片 ── */
  .header {
    background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 32px 28px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '';
    position: absolute;
    width: 200px; height: 200px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
    top: -60px; right: -40px;
  }
  .header h1 {
    color: var(--white);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .header .subtitle {
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    margin-top: 6px;
    font-weight: 300;
  }
  .header .counter {
    display: inline-flex;
    gap: 16px;
    margin-top: 14px;
    font-size: 13px;
    color: rgba(255,255,255,0.9);
  }
  .counter span { display: flex; align-items: center; gap: 4px; }
  .counter b { font-size: 18px; }

  /* ── 输入区 ── */
  .input-area {
    background: var(--white);
    padding: 20px 24px;
    display: flex;
    gap: 12px;
    border-bottom: 1px solid var(--pink-200);
  }
  .input-area input {
    flex: 1;
    border: 2px solid var(--pink-200);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    color: var(--text);
  }
  .input-area input::placeholder { color: #ccc; }
  .input-area input:focus {
    border-color: var(--pink-400);
    box-shadow: 0 0 0 4px rgba(255, 133, 192, 0.12);
  }
  .btn-add {
    background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
    color: var(--white);
    border: none;
    border-radius: 12px;
    width: 48px;
    font-size: 24px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    flex-shrink: 0;
  }
  .btn-add:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 16px rgba(247, 89, 171, 0.35);
  }
  .btn-add:active { transform: scale(0.95); }

  /* ── 过滤标签 ── */
  .filters {
    background: var(--white);
    padding: 12px 24px;
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--pink-200);
  }
  .filters button {
    background: var(--pink-100);
    border: 1.5px solid transparent;
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    font-family: inherit;
    color: var(--pink-600);
    cursor: pointer;
    transition: all 0.25s;
  }
  .filters button:hover { background: var(--pink-200); }
  .filters button.active {
    background: var(--white);
    border-color: var(--pink-400);
    font-weight: 500;
  }

  /* ── 列表 ── */
  .todo-list {
    background: var(--white);
    border-radius: 0 0 var(--radius) var(--radius);
    min-height: 200px;
    max-height: 55vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
  }
  .todo-list::-webkit-scrollbar { width: 6px; }
  .todo-list::-webkit-scrollbar-thumb {
    background: var(--pink-300);
    border-radius: 3px;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
    font-size: 14px;
  }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }

  /* ── 待办项 ── */
  .todo-item {
    display: flex;
    align-items: center;
    padding: 16px 24px;
    gap: 14px;
    border-bottom: 1px solid var(--pink-100);
    transition: background 0.2s;
    animation: slideIn 0.3s ease-out;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .todo-item:hover { background: var(--pink-100); }

  /* 自定义复选框 */
  .checkbox {
    width: 22px; height: 22px;
    border: 2px solid var(--pink-300);
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
    position: relative;
  }
  .checkbox:hover { border-color: var(--pink-500); }
  .checkbox.checked {
    background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
    border-color: var(--pink-500);
  }
  .checkbox.checked::after {
    content: '✓';
    color: white;
    font-size: 14px;
    font-weight: 700;
  }

  .todo-text {
    flex: 1;
    font-size: 15px;
    color: var(--text);
    line-height: 1.5;
    word-break: break-word;
    transition: all 0.3s;
  }
  .todo-text.done {
    text-decoration: line-through;
    color: var(--text-light);
    opacity: 0.6;
  }

  .btn-delete {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    flex-shrink: 0;
    padding: 4px;
  }
  .todo-item:hover .btn-delete { opacity: 0.5; }
  .btn-delete:hover { opacity: 1 !important; transform: scale(1.2); }

  /* ── 底部 ── */
  .footer {
    text-align: center;
    padding: 20px;
    color: var(--text-light);
    font-size: 12px;
    letter-spacing: 1px;
  }

  /* ── 二次元装饰人物 ── */
  .deco {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    filter: drop-shadow(0 4px 12px rgba(255,133,192,0.25));
  }
  .deco svg { display: block; }

  .deco-tl { top: 10px; left: 10px; animation: decoBob 4s ease-in-out infinite; }
  .deco-tr { top: 10px; right: 10px; animation: decoBob 4.5s ease-in-out infinite; animation-delay: -1.5s; }
  .deco-bl { bottom: 10px; left: 10px; animation: decoBob 5s ease-in-out infinite; animation-delay: -3s; }
  .deco-br { bottom: 10px; right: 10px; animation: decoBob 4.2s ease-in-out infinite; animation-delay: -2s; }

  @keyframes decoBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }

  /* ── 移动端适配 ── */
  @media (max-width: 480px) {
    body { padding: 0; }
    .app { max-width: 100%; }
    .header { border-radius: 0; padding: 24px 20px 18px; }
    .todo-list { border-radius: 0; max-height: 65vh; }
    .deco-tl svg, .deco-tr svg, .deco-bl svg, .deco-br svg { width: 90px; height: auto; }
  }
  @media (max-width: 768px) {
    .deco-tl svg, .deco-tr svg, .deco-bl svg, .deco-br svg { width: 110px; height: auto; }
  }
</style>
</head>

</svg>

<div class="app">
  <!-- 头部 -->
  <div class="header">
    <h1>✧ 我的待办清单 ✧</h1>
    <p class="subtitle">今天也要加油哦~</p>
    <div class="counter">
      <span>待完成 <b id="pendingCount">0</b></span>
      <span>已完成 <b id="doneCount">0</b></span>
    </div>
  </div>

  <!-- 输入 -->
  <div class="input-area">
    <input type="text" id="taskInput" placeholder="写下要做的事情~" maxlength="100">
    <button class="btn-add" id="addBtn" title="添加">+</button>
  </div>

  <!-- 过滤 -->
  <div class="filters">
    <button class="active" data-filter="all">全部</button>
    <button data-filter="pending">待完成</button>
    <button data-filter="done">已完成</button>
  </div>

  <!-- 列表 -->
  <div class="todo-list" id="todoList"></div>

  <div class="footer">✦ 用心生活 ✦ 认真待办 ✦</div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'pink_todos';

  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let filter = 'all';

  const input    = document.getElementById('taskInput');
  const addBtn   = document.getElementById('addBtn');
  const list     = document.getElementById('todoList');
  const pCount   = document.getElementById('pendingCount');
  const dCount   = document.getElementById('doneCount');
  const filterBtns = document.querySelectorAll('.filters button');

  // ── 樱花生成 ──
  function spawnSakura() {
    const petals = ['🌸', '✿', '❀', '💮'];
    const el = document.createElement('div');
    el.className = 'sakura';
    el.textContent = petals[Math.random() * petals.length | 0];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (12 + Math.random() * 12) + 'px';
    el.style.animationDuration = (6 + Math.random() * 8) + 's';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
  setInterval(spawnSakura, 1200);
  for (let i = 0; i < 6; i++) setTimeout(spawnSakura, i * 200);

  // ── 持久化 ──
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  // ── 渲染 ──
  function render() {
    const filtered = todos.filter(t => {
      if (filter === 'pending') return !t.done;
      if (filter === 'done')    return t.done;
      return true;
    });

    pCount.textContent = todos.filter(t => !t.done).length;
    dCount.textContent = todos.filter(t => t.done).length;

    if (filtered.length === 0) {
      const msgs = { all: '还没有待办事项哦~', pending: '全部完成啦！', done: '还没有完成的任务' };
      list.innerHTML = `<div class="empty"><div class="icon">🎀</div>${msgs[filter]}</div>`;
      return;
    }

    list.innerHTML = filtered.map(t => `
      <div class="todo-item" data-id="${t.id}">
        <div class="checkbox ${t.done ? 'checked' : ''}" onclick="toggle(${t.id})"></div>
        <span class="todo-text ${t.done ? 'done' : ''}">${esc(t.text)}</span>
        <button class="btn-delete" onclick="remove(${t.id})" title="删除">✕</button>
      </div>
    `).join('');
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ── 操作 ──
  function add() {
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    todos.unshift({ id: Date.now(), text, done: false });
    input.value = '';
    save(); render();
    input.focus();
  }

  window.toggle = function (id) {
    const t = todos.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  };

  window.remove = function (id) {
    const item = list.querySelector(`[data-id="${id}"]`);
    if (item) {
      item.style.transition = 'opacity 0.25s, transform 0.25s';
      item.style.opacity = '0';
      item.style.transform = 'translateX(30px)';
      setTimeout(() => {
        todos = todos.filter(t => t.id !== id);
        save(); render();
      }, 250);
    }
  };

  // ── 事件 ──
  addBtn.addEventListener('click', add);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
